<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Booth Hát Xẩm – Mô hình 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div id="title"><b>Hát Xẩm</b><span>DÒNG CHẢY VĂN HÓA DÂN GIAN</span></div>
<div id="hint">Kéo để xoay · Cuộn/chụm để zoom</div>
<div id="bar">
  <button data-v="all">Tổng thể</button>
  <button data-v="top">Mặt bằng</button>
  <button data-v="1">Chặng 1</button>
  <button data-v="2">Chặng 2</button>
  <button data-v="3">Chặng 3</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="main.js"></script>
</body>
</html>
